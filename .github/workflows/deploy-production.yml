name: Deploy Production

# Pipeline: build-api + build-web → deploy → migrate → (seed: opt-in)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_data:
        description: '⚠️ Seed dữ liệu mẫu (XOÁ SẠCH DB hiện có rồi tạo lại)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/iampatrickkk/hrms-api
  IMAGE_WEB: ghcr.io/iampatrickkk/hrms-web
  NEXT_PUBLIC_API_URL: https://api.hrwebsite.airquality.info.vn

jobs:
  # ── 1) Build & push image API (NestJS) ────────────────────────
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ── 2) Build & push image Web (Next.js) ───────────────────────
  build-web:
    name: Build Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── 3) Deploy stack lên VPS (web + api + postgres + caddy) ─────
  deploy:
    name: Deploy (web + api + db + caddy)
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose & Caddyfile lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /opt/hrms

      - name: Pull image & khởi động stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/hrms
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cat > .env <<EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '8h' }}
            IMAGE_TAG=$IMAGE_TAG
            EOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}

  # ── 4) Migrate: TypeORM synchronize chạy tự động khi api boot ──
  #     Job này CHỜ & XÁC MINH api khởi động OK = schema đã sync.
  #     (Project dùng synchronize:true, chưa có migration files.
  #      Sau này nếu chuyển sang migration thật → chạy lệnh ở đây.)
  migrate:
    name: Migrate (TypeORM auto-sync)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chờ API sync schema & healthy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/hrms
            echo "Chờ API khởi động (synchronize tạo/cập nhật schema)..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api \
                   wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1; then
                echo "✅ API healthy — schema đã đồng bộ."
                exit 0
              fi
              echo "  ...thử lại ($i/30)"; sleep 5
            done
            echo "❌ API không healthy sau 150s — xem log:"
            docker compose -f docker-compose.prod.yml logs --tail=80 api
            exit 1

  # ── 5) Seed: CHỈ chạy thủ công khi tick seed_data (XOÁ SẠCH DB) ─
  seed:
    name: Seed data (opt-in, ⚠️ wipe)
    needs: migrate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_data == true }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Drop & seed dữ liệu mẫu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/hrms
            docker compose -f docker-compose.prod.yml exec -T api \
              pnpm --filter @hrms/api seed
            echo "Restart api sau seed..."
            docker compose -f docker-compose.prod.yml restart api
