# ───────────────────────────────────────────────────────────────
# Production stack HRMS (chạy trên VPS 42.96.18.126)
# postgres + api + web. KHÔNG có Caddy riêng — DÙNG CHUNG caddy sẵn có
# của project air-quality (network ngoài: airquality_prod).
# Image api/web pull từ GHCR. Biến môi trường lấy từ file .env.
# ───────────────────────────────────────────────────────────────
services:
  postgres:
    image: ghcr.io/iampatrickkk/postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ghcr.io/iampatrickkk/hrms-api:${IMAGE_TAG:-latest}
    container_name: hrms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: "4000"
      CORS_ORIGIN: https://hrwebsite.airquality.info.vn
    expose: ["4000"]
    networks: [internal, edge] # internal: tới postgres; edge: để caddy proxy

  web:
    image: ghcr.io/iampatrickkk/hrms-web:${IMAGE_TAG:-latest}
    container_name: hrms-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose: ["3000"]
    networks: [edge] # chỉ cần để caddy proxy (web gọi api qua URL public)

volumes:
  postgres-data:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: airquality_prod # caddy của air-quality nằm trên network này
